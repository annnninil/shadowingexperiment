<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shadowing Experiment</title>
<script src="https://cdn.jsdelivr.net/npm/jspsych@7.3.4/dist/jspsych.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-keyboard-response@1.1.3/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-button-response@1.1.3/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-survey-text@1.1.3/dist/index.browser.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspsych@7.3.4/css/jspsych.css">
<style>
  body { background: #1a1a2e; color: #eee; font-family: Arial, sans-serif; }
  .jspsych-content { max-width: 800px; }
  .jspsych-btn { background: #4a90d9; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 8px; }
  .jspsych-btn:hover { background: #357abd; }
  .lang-tag { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; margin-bottom: 12px; }
  .eng { background: #2d6a9f; }
  .mand { background: #9f2d2d; }
  .rec { color: #ff6b6b; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<script>

const trials = [
  {file:"stimuli/eng_p1_1_0x.wav", language:"English", passage:"p1", speed:"1x"},
  {file:"stimuli/eng_p1_1_5x.wav", language:"English", passage:"p1", speed:"1.5x"},
  {file:"stimuli/eng_p1_2_0x.wav", language:"English", passage:"p1", speed:"2x"},
  {file:"stimuli/eng_p2_1_0x.wav", language:"English", passage:"p2", speed:"1x"},
  {file:"stimuli/eng_p2_1_5x.wav", language:"English", passage:"p2", speed:"1.5x"},
  {file:"stimuli/eng_p2_2_0x.wav", language:"English", passage:"p2", speed:"2x"},
  {file:"stimuli/mand_p1_1_0x.wav", language:"Mandarin", passage:"p1", speed:"1x"},
  {file:"stimuli/mand_p1_1_5x.wav", language:"Mandarin", passage:"p1", speed:"1.5x"},
  {file:"stimuli/mand_p1_2_0x.wav", language:"Mandarin", passage:"p1", speed:"2x"},
  {file:"stimuli/mand_p2_1_0x.wav", language:"Mandarin", passage:"p2", speed:"1x"},
  {file:"stimuli/mand_p2_1_5x.wav", language:"Mandarin", passage:"p2", speed:"1.5x"},
  {file:"stimuli/mand_p2_2_0x.wav", language:"Mandarin", passage:"p2", speed:"2x"},
];

// shuffle
for (let i = trials.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [trials[i], trials[j]] = [trials[j], trials[i]];
}

let mediaRecorder, audioChunks = [], recordings = [];

async function startRec() {
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  audioChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
  mediaRecorder.start();
}

function stopRec() {
  return new Promise(resolve => {
    mediaRecorder.onstop = () => resolve(new Blob(audioChunks, {type:'audio/wav'}));
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  });
}

function toBase64(blob) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onloadend = () => resolve(r.result);
    r.readAsDataURL(blob);
  });
}

const jsPsych = initJsPsych({
  on_finish: function() {
    const participant = jsPsych.data.get().values()[0]?.participant || 'unknown';
    const blob = new Blob([JSON.stringify({participant, trials: recordings}, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `shadowing_${participant}_${Date.now()}.json`;
    a.click();
    document.body.innerHTML = '<div style="text-align:center;padding:80px;font-size:20px">謝謝您的參與！Thank you!<br><br>Data downloaded.</div>';
  }
});

const timeline = [];

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <h2>Shadowing Experiment / 跟讀實驗</h2>
    <p>You will hear passages in <b>English</b> and <b>Mandarin</b> at different speeds.</p>
    <p>Please <b>repeat aloud what you hear as you hear it</b> (simultaneously / 同步跟讀).</p>
    <p>您將聽到英文和普通話的段落，請在聽到的同時立即大聲重複。</p>
    <p style="color:#aaa;font-size:13px">Please allow microphone access when prompted.<br>請允許麥克風權限。</p>
  `,
  choices: ['Begin / 開始'],
});

timeline.push({
  type: jsPsychSurveyText,
  questions: [
    {prompt:'Participant ID (initials + birth month, e.g. AL03)', name:'participant', required:true},
    {prompt:'L1 (first language / 母語)', name:'L1', required:true},
    {prompt:'Years studying English / 學英文幾年', name:'years_eng', required:true},
    {prompt:'English listening (1=beginner, 7=native) / 英文聽力自評', name:'eng_prof', required:true},
  ],
  on_finish: function(data) {
    jsPsych.data.addProperties({participant: data.response.participant});
  }
});

// mic permission test
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `<p>Click to enable microphone recording.<br>點擊啟用麥克風錄音。</p>`,
  choices: ['Enable Microphone / 啟用麥克風'],
  on_finish: async function() {
    try {
      const s = await navigator.mediaDevices.getUserMedia({audio:true});
      s.getTracks().forEach(t => t.stop());
    } catch(e) { alert('Microphone access denied. Please allow microphone and refresh.'); }
  }
});

for (let i = 0; i < trials.length; i++) {
  const t = trials[i];
  const cls = t.language === 'English' ? 'eng' : 'mand';

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <p>Trial ${i+1} / ${trials.length}</p>
      <span class="lang-tag ${cls}">${t.language} — ${t.speed}</span>
      <p>Ready? Press <b>SPACE</b> to begin.</p>
      <p>準備好了嗎？按<b>空白鍵</b>開始跟讀。</p>
    `,
    choices: [' '],
  });

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <span class="lang-tag ${cls}">${t.language} — ${t.speed}</span>
      <p>🎙 Recording... Please shadow the audio.</p>
      <p class="rec">● 錄音中，請跟讀...</p>
    `,
    choices: "NO_KEYS",
    trial_duration: null,
    on_start: async function() {
      await startRec();
      const audio = new Audio(t.file);
      audio.play();
      audio.onended = async function() {
        setTimeout(async function() {
          const blob = await stopRec();
          const b64 = await toBase64(blob);
          recordings.push({trial:i+1, language:t.language, passage:t.passage, speed:t.speed, audio:b64});
          jsPsych.finishTrial();
        }, 3000);
      };
    },
  });

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<p style="color:#6fcf97">✓ Recorded</p>',
    choices: "NO_KEYS",
    trial_duration: 800,
  });
}

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `<h2>Thank you! / 謝謝！</h2><p>Click to download your data.</p>`,
  choices: ['Download Data / 下載數據'],
});

jsPsych.run(timeline);
</script>
</body>
</html>
